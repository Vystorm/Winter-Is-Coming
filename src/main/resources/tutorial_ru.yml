title: 'Winter Is Coming'
pages:
  - title: 'Зима на сервере'
    text: |
      Зима идёт по календарю: растёт снег, замерзает вода, становится холодно. /winter status покажет дату и ваш холод.
  - title: 'Согреться'
    text: |
      Огонь, лава и костры греют, крыши укрывают. Каждая кожаная часть брони блокирует четверть холода.
  - title: 'Подарки и снежные бои'
    text: |
      /winter calendar открывает адвент-календарь в декабре. Кидайте снежки или вызывайте на дуэль: /winter duel PLAYER.
