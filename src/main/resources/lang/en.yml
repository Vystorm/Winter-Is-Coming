# /winter through Vystorm Core: description, help and tab completion per player. "aliases" under commands.winter are
# extra root commands (server-wide, the admin chooses the languages: Core config commands.localized-aliases); "name" and
# "aliases" of a subcommand are accepted in every language, English always works.
snowball-surrender-won: '<green>{player} gave up the snowball duel. You win!</green>'
snowball-surrender-lost: '<yellow>You gave up the snowball duel. {player} wins.</yellow>'
snowball-no-duel: '<yellow>You are not in a snowball duel.</yellow>'
commands:
  winter:
    description: "Winter season: status, gifts, advent calendar, snowball fights and season administration"
    aliases: []
    sub:
      missions:
        name: "missions"
        aliases: []
        description: "Shared winter goals and rewards"
      status:
        name: status
        aliases: []
        description: "Date, season phase, snow strength, holiday and your cold"
      warmth:
        name: warmth
        aliases: []
        description: "Your cold, stored warmth and equipment protection"
      preview:
        name: preview
        aliases: []
        description: "Show the season phase of a date without changing anything"
        args:
          date: YYYY-MM-DD
      setdate:
        name: setdate
        aliases: []
        description: "Run the winter as if it were this date"
        args:
          date: YYYY-MM-DD
      resume:
        name: resume
        aliases: []
        description: "Follow the real calendar again"
      thaw:
        name: thaw
        aliases: []
        description: "Thaw all winter snow and ice now"
      admin:
        name: admin
        aliases: []
        description: "Open the winter admin menu"
      lamp:
        name: lamp
        aliases: []
        description: "Turn the glass block you look at into a Christmas light"
      reload:
        name: reload
        aliases: []
        description: "Reload the configuration"
      claim:
        name: claim
        aliases: []
        description: "Claim today's holiday gift and pending gifts"
      claims:
        name: claims
        aliases: []
        description: "How many gifts are waiting for you"
      calendar:
        name: calendar
        aliases: []
        description: "Open the advent calendar"
      snowball:
        name: snowball
        aliases: []
        description: "Your snowball hits, duel wins, rank and the top 5"
      storm:
        name: storm
        aliases: []
        description: "The next snowstorm or blizzard in your world"
        sub:
          snowstorm:
            name: snowstorm
            aliases: []
            description: "Admin: start a snowstorm now"
          blizzard:
            name: blizzard
            aliases: []
            description: "Admin: start a blizzard now"
          stop:
            name: stop
            aliases: []
            description: "Admin: end the storm"
      build:
        name: build
        aliases: []
        description: 'Build without the plugin''s snow around you'
      snowfall:
        name: snowfall
        aliases: []
        description: 'Turn the falling snow around you on or off'
      spot:
        name: spot
        aliases: []
        description: 'Season spots: areas where snow falls'
        sub:
          list:
            name: list
            aliases: []
            description: 'All season spots'
          add:
            name: add
            aliases: []
            description: 'Add a season spot here'
            args:
              spot: 'SPOT'
              radius: 'RADIUS'
          remove:
            name: remove
            aliases: []
            description: 'Remove a season spot'
            args:
              spot: 'SPOT'
      sled:
        name: sled
        aliases: []
        description: "Sled runs and best times"
        sub:
          list:
            name: list
            aliases: []
            description: "All sled runs"
          top:
            name: top
            aliases: []
            description: "Best times of a run"
            args:
              run: "RUN"
          create:
            name: create
            aliases: []
            description: "Set the start of a run here"
            args:
              run: "RUN"
          finish:
            name: finish
            aliases: []
            description: "Set the finish of a run here"
            args:
              run: "RUN"
          delete:
            name: delete
            aliases: []
            description: "Delete a run"
            args:
              run: "RUN"
      surrender:
        name: surrender
        aliases: []
        description: "Give up your snowball duel; your opponent wins"
      duel:
        name: duel
        aliases: []
        description: "Challenge a player to a snowball duel"
        args:
          player: PLAYER
