      warmth:
        name: warmth
        aliases: []
        description: Votre protection contre le froid, la chaleur et l'équipement
      preview:
        name: preview
        aliases: []
        description: Afficher la phase saison d'une date sans rien changer
        args:
          date: YYYY-MM-DD
      setdate:
        name: setdate
        aliases: []
        description: Exécutez l'hiver comme si c'était cette date
        args:
          date: YYYY-MM-DD
      resume:
        name: resume
        aliases: []
        description: Suivez à nouveau le calendrier réel
      thaw:
        name: thaw
        aliases: []
        description: Dégelez toute la neige et la glace d'hiver maintenant
      admin:
        name: admin
        aliases: []
        description: "Ouvrir la gestion de l’hiver"
      lamp:
        name: lamp
        aliases: []
        description: "Transformer le verre regardé en guirlande"
      reload:
        name: reload
        aliases: []
        description: Recharger la configuration
      claim:
        name: claim
        aliases: []
        description: Réclamez le cadeau de fête d'aujourd'hui et les cadeaux en attente
      claims:
        name: claims
        aliases: []
        description: Combien de cadeaux vous attendent ?
      calendar:
        name: calendar
        aliases: []
        description: Ouvrir le calendrier de l'aventure
      snowball:
        name: snowball
        aliases: []
        description: Vos coups de boule de neige, duel gagne, rang et le meilleur 5
      storm:
        name: storm
        aliases: []
        description: "La prochaine tempête de neige ou le prochain blizzard de ton monde"
        sub:
          snowstorm:
            name: snowstorm
            aliases: []
            description: "Admin : lancer une tempête de neige"
          blizzard:
            name: blizzard
            aliases: []
            description: "Admin : lancer un blizzard"
          stop:
            name: stop
            aliases: []
            description: "Admin : arrêter la tempête"
      build:
        name: build
        aliases: []
        description: 'Construire sans la neige du plugin autour de toi'
      snowfall:
        name: snowfall
        aliases: []
        description: 'Activer ou désactiver la neige qui tombe autour de toi'
      spot:
        name: spot
        aliases: []
        description: 'Zones de saison : où la neige tombe'
        sub:
          list:
            name: list
            aliases: []
            description: 'Toutes les zones de saison'
          add:
            name: add
            aliases: []
            description: 'Ajouter une zone de saison ici'
