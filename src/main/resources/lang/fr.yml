            aliases: []
            description: "Placer ici le départ d’une piste"
            args:
              run: "RUN"
          finish:
            name: finish
            aliases: []
            description: "Placer ici l’arrivée d’une piste"
            args:
              run: "RUN"
          delete:
            name: delete
            aliases: []
            description: "Supprimer une piste"
            args:
              run: "RUN"
