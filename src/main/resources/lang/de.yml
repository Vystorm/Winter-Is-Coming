# /winter über Vystorm Core: Beschreibung, Hilfe und Tab-Vervollständigung je Spieler. "aliases" unter commands.winter
# sind zusätzliche Hauptbefehle (serverweit, der Admin wählt die Sprachen: Core-Konfig commands.localized-aliases);
# "name" und "aliases" eines Unterbefehls werden in jeder Sprache verstanden, Englisch geht immer.
snowball-surrender-won: '<green>{player} hat das Schneeballduell aufgegeben. Du gewinnst!</green>'
snowball-surrender-lost: '<yellow>Du hast das Schneeballduell aufgegeben. {player} gewinnt.</yellow>'
snowball-no-duel: '<yellow>Du bist in keinem Schneeballduell.</yellow>'
commands:
  winter:
    description: "Wintersaison: Status, Geschenke, Adventskalender, Schneeballschlachten und Saisonverwaltung"
    aliases: [winterzeit]
    sub:
      missions:
        name: "missionen"
        aliases: []
        description: "Gemeinsame Winterziele und Belohnungen"
      status:
        name: status
        aliases: []
        description: "Datum, Saisonphase, Schneestärke, Feiertag und deine Kälte"
      warmth:
        name: wärme
        aliases: []
        description: "Deine Kälte, Wärmereserve und dein Ausrüstungsschutz"
      preview:
        name: vorschau
        aliases: []
        description: "Saisonphase eines Datums zeigen, ohne etwas zu ändern"
        args:
          date: JJJJ-MM-TT
      setdate:
        name: datum
        aliases: [datumsetzen]
        description: "Den Winter so laufen lassen, als wäre dieses Datum"
        args:
          date: JJJJ-MM-TT
      resume:
        name: fortsetzen
        aliases: []
        description: "Wieder dem echten Kalender folgen"
      thaw:
        name: tauwetter
        aliases: [tauen]
        description: "Allen Winterschnee und alles Eis jetzt tauen lassen"
      admin:
        name: verwaltung
        aliases: []
        description: "Winter-Verwaltung öffnen"
      lamp:
        name: lampe
        aliases: []
        description: "Angeschauten Glasblock zur Weihnachtslampe machen"
      reload:
        name: neuladen
        aliases: []
        description: "Konfiguration neu laden"
      claim:
        name: abholen
        aliases: []
        description: "Das heutige Feiertagsgeschenk und offene Geschenke abholen"
      claims:
        name: geschenke
        aliases: []
        description: "Wie viele Geschenke auf dich warten"
      calendar:
        name: kalender
        aliases: [adventskalender]
        description: "Den Adventskalender öffnen"
      snowball:
        name: schneeball
        aliases: [schneeballschlacht]
        description: "Deine Schneeballtreffer, Duellsiege, dein Rang und die Top 5"
      storm:
        name: sturm
        aliases: []
        description: "Der nächste Schneesturm oder Blizzard in deiner Welt"
        sub:
          snowstorm:
            name: schneesturm
            aliases: []
            description: "Admin: jetzt einen Schneesturm starten"
          blizzard:
            name: blizzard
            aliases: []
            description: "Admin: jetzt einen Blizzard starten"
          stop:
            name: stopp
            aliases: []
            description: "Admin: den Sturm beenden"
      build:
        name: build
        aliases: []
        description: 'Ohne Plugin-Schnee um dich herum bauen'
      snowfall:
        name: snowfall
        aliases: []
        description: 'Fallenden Schnee um dich herum ein- oder ausschalten'
      spot:
        name: spot
        aliases: []
        description: 'Season-Spots: Bereiche, in denen es schneit'
        sub:
          list:
            name: list
            aliases: []
            description: 'Alle Season-Spots'
          add:
            name: add
            aliases: []
            description: 'Season-Spot hier setzen'
            args:
              spot: 'SPOT'
              radius: 'RADIUS'
          remove:
            name: remove
            aliases: []
            description: 'Season-Spot entfernen'
            args:
              spot: 'SPOT'
      sled:
        name: sled
        aliases: []
        description: "Rodelbahnen und Bestzeiten"
        sub:
          list:
            name: list
            aliases: []
            description: "Alle Rodelbahnen"
          top:
            name: top
            aliases: []
            description: "Bestzeiten einer Bahn"
            args:
              run: "RUN"
          create:
            name: create
            aliases: []
            description: "Start einer Bahn hier setzen"
            args:
              run: "RUN"
          finish:
            name: finish
            aliases: []
            description: "Ziel einer Bahn hier setzen"
            args:
              run: "RUN"
          delete:
            name: delete
            aliases: []
            description: "Bahn löschen"
            args:
              run: "RUN"
      surrender:
        name: aufgeben
        aliases: []
        description: "Dein Schneeballduell aufgeben; dein Gegner gewinnt"
      duel:
        name: duell
        aliases: []
        description: "Einen Spieler zum Schneeballduell herausfordern"
        args:
          player: SPIELER
