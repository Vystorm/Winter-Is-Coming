commands:
  winter:
    description: 'Temporada de inverno: status, presentes, calendário de advento, lutas de bola de neve e administração da
      temporada'
    aliases: []
    sub:
      missions:
        name: "missions"
        aliases: []
        description: "Metas e recompensas de inverno compartilhadas"
      status:
        name: status
        aliases: []
        description: Data, fase da temporada, força da neve, férias e seu frio
      warmth:
        name: warmth
        aliases: []
        description: Seu frio, aquecimento armazenado e proteção de equipamentos
      preview:
        name: preview
        aliases: []
        description: Mostre a fase de temporada de um encontro sem mudar nada
        args:
          date: YYYY-MM-DD
      setdate:
        name: setdate
        aliases: []
        description: Correr o inverno como se fosse esta data
        args:
          date: YYYY-MM-DD
      resume:
        name: resume
        aliases: []
        description: Siga o calendário real novamente
      thaw:
        name: thaw
        aliases: []
        description: Deite toda neve de inverno e gelo agora
      admin:
        name: admin
        aliases: []
        description: "Abrir o gerenciamento do inverno"
      lamp:
        name: lamp
        aliases: []
        description: "Transforma o vidro observado em luz de Natal"
      reload:
        name: reload
        aliases: []
        description: Recarregar a configuração
      claim:
        name: claim
        aliases: []
        description: Reclame o presente de hoje e presentes pendentes
      claims:
        name: claims
        aliases: []
        description: Quantos presentes estão esperando por você?
      calendar:
        name: calendar
        aliases: []
        description: Abra o calendário do advento
      snowball:
        name: snowball
        aliases: []
        description: Seus hits bola de neve, duelo ganha, classificação e o top 5
      storm:
        name: storm
        aliases: []
        description: "A próxima tempestade de neve ou nevasca no seu mundo"
        sub:
          snowstorm:
            name: snowstorm
            aliases: []
            description: "Admin: iniciar uma tempestade de neve"
          blizzard:
            name: blizzard
            aliases: []
            description: "Admin: iniciar uma nevasca"
          stop:
            name: stop
            aliases: []
            description: "Admin: encerrar a tempestade"
      build:
        name: build
        aliases: []
        description: 'Construir sem a neve do plugin ao seu redor'
      snowfall:
        name: snowfall
        aliases: []
        description: 'Liga ou desliga a neve caindo ao seu redor'
      spot:
        name: spot
        aliases: []
        description: 'Áreas de estação: onde a neve cai'
        sub:
          list:
            name: list
            aliases: []
            description: 'Todas as áreas de estação'
          add:
            name: add
            aliases: []
            description: 'Adicionar uma área de estação aqui'
            args:
              spot: 'AREA'
              radius: 'RAIO'
          remove:
            name: remove
            aliases: []
            description: 'Remover uma área de estação'
            args:
              spot: 'AREA'
      sled:
        name: sled
        aliases: []
        description: "Pistas de trenó e melhores tempos"
        sub:
          list:
            name: list
            aliases: []
            description: "Todas as pistas"
          top:
            name: top
            aliases: []
            description: "Melhores tempos de uma pista"
            args:
              run: "RUN"
          create:
            name: create
            aliases: []
            description: "Definir aqui a largada"
            args:
              run: "RUN"
          finish:
            name: finish
            aliases: []
            description: "Definir aqui a chegada"
            args:
              run: "RUN"
          delete:
            name: delete
            aliases: []
            description: "Apagar uma pista"
            args:
              run: "RUN"
      surrender:
        name: surrender
        aliases: []
        description: Desista do seu duelo de bola de neve, seu oponente ganha
      duel:
        name: duel
        aliases: []
        description: Desafie um jogador para um duelo de bola de neve
        args:
          player: PLAYER
