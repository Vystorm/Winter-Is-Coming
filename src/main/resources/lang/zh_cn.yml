snowfall-disabled: '<yellow>本服务器已关闭飘雪（config.yml 中的 snowfall.enabled）。'
status-snowfall-on: '<gray>飘雪：开启（每秒 {amount} 片雪花，半径 {radius}）'
status-snowfall-off: '<gray>飘雪：关闭'
