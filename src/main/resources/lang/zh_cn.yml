admin-snowfall: '<yellow>飘雪</yellow>'
admin-snowfall-label: '飘雪数量（0 = 关闭）'
admin-snowfall-text: '无论天气如何，每位玩家周围每秒飘落的雪花数。0 表示关闭。这与降雪速度无关，后者只决定地面积雪增长的快慢。'
admin-snowfall-set: '<green>飘雪已设为每秒 {value} 片雪花。</green>'
