# 通过 Vystorm Core 提供的 /winter：每位玩家看到自己语言的说明、帮助和 Tab 补全。commands.winter 下的 "aliases" 是额外的
# 主命令（全服生效，由管理员在 Core 配置 commands.localized-aliases 中选择语言）；子命令的 "name" 和 "aliases"
# 在所有语言中都可使用，英文始终有效。
snowball-surrender-won: '<green>{player} 在雪球决斗中认输了。你获胜！</green>'
snowball-surrender-lost: '<yellow>你在雪球决斗中认输了。{player} 获胜。</yellow>'
snowball-no-duel: '<yellow>你当前没有进行雪球决斗。</yellow>'
commands:
  winter:
    description: "冬季：状态、礼物、降临节日历、雪球大战和季节管理"
    aliases: [凛冬将至]
    sub:
      missions:
        name: "任务"
        aliases: []
        description: "共同冬季目标和奖励"
      status:
        name: 状态
        aliases: []
        description: "日期、季节阶段、积雪强度、节日和你的寒冷程度"
      warmth:
        name: 保暖
        aliases: []
        description: "查看寒冷、储存热量和装备防护"
      preview:
        name: 预览
        aliases: []
        description: "显示某个日期的季节阶段，不做任何更改"
        args:
          date: YYYY-MM-DD
      setdate:
        name: 设定日期
        aliases: []
        description: "让冬季按这个日期运行"
        args:
          date: YYYY-MM-DD
      resume:
        name: 恢复
        aliases: []
        description: "重新跟随真实日历"
      thaw:
        name: 解冻
        aliases: []
        description: "立即融化所有冬季积雪和冰"
      admin:
        name: 管理
        aliases: []
        description: "打开冬季管理菜单"
      lamp:
        name: 彩灯
        aliases: []
        description: "将你看向的玻璃方块变成圣诞彩灯"
      reload:
        name: 重载
        aliases: []
        description: "重新加载配置"
      claim:
        name: 领取
        aliases: []
        description: "领取今天的节日礼物和待领取的礼物"
      claims:
        name: 礼物
        aliases: []
        description: "有多少礼物在等你"
      calendar:
        name: 日历
        aliases: [降临节日历]
        description: "打开降临节日历"
      snowball:
        name: 雪球
        aliases: []
        description: "你的雪球命中数、决斗胜场、排名和前五名"
      storm:
        name: 风暴
        aliases: []
        description: "你所在世界的下一场暴风雪或冰风暴"
        sub:
          snowstorm:
            name: 暴风雪
            aliases: []
            description: "管理员：立即开始暴风雪"
          blizzard:
            name: 冰风暴
            aliases: []
            description: "管理员：立即开始冰风暴"
          stop:
            name: 停止
            aliases: []
            description: "管理员：结束风暴"
      build:
        name: 建造
        aliases: []
        description: '在你周围建造时不受插件雪影响'
      snowfall:
        name: 降雪
        aliases: []
        description: '开启或关闭你周围飘落的雪'
      spot:
        name: 季节区域
        aliases: []
        description: '季节区域：下雪的地方'
        sub:
          list:
            name: list
            aliases: []
            description: '所有季节区域'
          add:
            name: add
            aliases: []
            description: '在此添加季节区域'
            args:
              spot: '区域'
              radius: '半径'
          remove:
            name: remove
            aliases: []
            description: '移除季节区域'
            args:
              spot: '区域'
      sled:
        name: sled
        aliases: []
        description: "雪橇赛道与最佳成绩"
        sub:
          list:
            name: list
            aliases: []
            description: "所有赛道"
          top:
            name: top
            aliases: []
            description: "某赛道的最佳成绩"
            args:
              run: "RUN"
          create:
            name: create
            aliases: []
            description: "在此设置赛道起点"
            args:
              run: "RUN"
          finish:
            name: finish
            aliases: []
            description: "在此设置赛道终点"
            args:
              run: "RUN"
          delete:
            name: delete
            aliases: []
            description: "删除赛道"
            args:
              run: "RUN"
      surrender:
        name: 认输
        aliases: []
        description: "退出当前雪球决斗，对手获胜"
      duel:
        name: 决斗
        aliases: []
        description: "向一名玩家发起雪球决斗"
        args:
          player: 玩家
