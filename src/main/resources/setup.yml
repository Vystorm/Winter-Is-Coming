{
  "version": 1,
  "intro": {
    "en": "Winter follows the real calendar in the worlds listed in config.yml. Decide how harsh it should be.",
    "de": "Der Winter folgt dem echten Kalender in den Welten aus der config.yml. Lege fest, wie hart er sein soll.",
    "fr": "L’hiver suit le vrai calendrier dans les mondes de config.yml. Choisissez sa rigueur.",
    "it": "L’inverno segue il calendario reale nei mondi di config.yml. Decidi quanto deve essere rigido.",
    "pt_br": "O inverno segue o calendário real nos mundos do config.yml. Decida o quão rigoroso será.",
    "ru": "Зима идёт по реальному календарю в мирах из config.yml. Выберите её суровость.",
    "zh_cn": "冬季按真实日历在 config.yml 所列世界中运行。请决定严酷程度。"
  },
  "questions": [
    {
      "id": "snow",
      "text": {
        "en": "How deep should the snow get?",
        "de": "Wie hoch soll der Schnee werden?",
        "fr": "Quelle hauteur de neige ?",
        "it": "Quanto deve essere alta la neve?",
        "pt_br": "Qual a altura da neve?",
        "ru": "Какой глубины снег?",
        "zh_cn": "积雪应有多深？"
      },
      "type": "choice",
      "recommended": "normal",
      "options": [
        {
          "id": "light",
          "label": {
            "en": "Light (one block)",
            "de": "Leicht (ein Block)",
            "fr": "Légère (un bloc)",
            "it": "Leggera (un blocco)",
            "pt_br": "Leve (um bloco)",
            "ru": "Лёгкий (один блок)",
            "zh_cn": "浅（一格）"
          },
          "set": {
            "config.yml:snow.max-layers": 8
          }
        },
        {
          "id": "normal",
          "label": {
            "en": "Normal (1.5 blocks)",
            "de": "Normal (1,5 Blöcke)",
            "fr": "Normale (1,5 bloc)",
            "it": "Normale (1,5 blocchi)",
            "pt_br": "Normal (1,5 bloco)",
            "ru": "Обычный (1,5 блока)",
            "zh_cn": "普通（1.5 格）"
          },
          "set": {
            "config.yml:snow.max-layers": 12
          }
        },
        {
          "id": "deep",
          "label": {
            "en": "Deep (4 blocks)",
            "de": "Tief (4 Blöcke)",
            "fr": "Profonde (4 blocs)",
            "it": "Alta (4 blocchi)",
            "pt_br": "Profunda (4 blocos)",
            "ru": "Глубокий (4 блока)",
            "zh_cn": "深（4 格）"
          },
          "set": {
            "config.yml:snow.max-layers": 32
          }
        }
      ]
    },
    {
      "id": "speed",
      "text": {
        "en": "How fast should snow and thaw spread?",
        "de": "Wie schnell sollen Schnee und Tauwetter vorankommen?",
        "fr": "À quelle vitesse la neige et le dégel doivent-ils progresser ?",
        "it": "Quanto velocemente devono avanzare neve e disgelo?",
        "pt_br": "Com que rapidez a neve e o degelo devem avançar?",
        "ru": "Как быстро должны распространяться снег и оттепель?",
        "zh_cn": "积雪和融化扩散得多快？"
      },
      "type": "choice",
      "recommended": "normal",
      "options": [
        {
          "id": "gentle",
          "label": {
            "en": "Gently (light servers)",
            "de": "Gemächlich (schwache Server)",
            "fr": "Doucement (petits serveurs)",
            "it": "Lentamente (server leggeri)",
            "pt_br": "Devagar (servidores fracos)",
            "ru": "Медленно (слабые серверы)",
            "zh_cn": "缓慢（低配服务器）"
          },
          "set": {
            "config.yml:performance.changes-per-cycle": 4,
            "config.yml:performance.columns-per-cycle": 24
          }
        },
        {
          "id": "normal",
          "label": {
            "en": "Normal",
            "de": "Normal",
            "fr": "Normal",
            "it": "Normale",
            "pt_br": "Normal",
            "ru": "Обычно",
            "zh_cn": "普通"
          },
          "set": {
            "config.yml:performance.changes-per-cycle": 16,
            "config.yml:performance.columns-per-cycle": 96
          }
        },
        {
          "id": "fast",
          "label": {
            "en": "Fast",
            "de": "Schnell",
            "fr": "Rapide",
            "it": "Veloce",
            "pt_br": "Rápido",
            "ru": "Быстро",
            "zh_cn": "快速"
          },
          "set": {
            "config.yml:performance.changes-per-cycle": 32,
            "config.yml:performance.columns-per-cycle": 256
          }
        }
      ]
    },
    {
      "id": "cold",
      "text": {
        "en": "Should players feel the cold?",
        "de": "Sollen Spieler die Kälte spüren?",
        "fr": "Les joueurs doivent-ils ressentir le froid ?",
        "it": "I giocatori devono sentire il freddo?",
        "pt_br": "Os jogadores devem sentir o frio?",
        "ru": "Должны ли игроки мёрзнуть?",
        "zh_cn": "玩家是否会感到寒冷？"
      },
      "type": "choice",
      "recommended": "gentle",
      "options": [
        {
          "id": "off",
          "label": {
            "en": "No",
            "de": "Nein",
            "fr": "Non",
            "it": "No",
            "pt_br": "Não",
            "ru": "Нет",
            "zh_cn": "否"
          },
          "set": {
            "config.yml:cold.enabled": false
          }
        },
        {
          "id": "gentle",
          "label": {
            "en": "Yes, without damage",
            "de": "Ja, ohne Schaden",
            "fr": "Oui, sans dégâts",
            "it": "Sì, senza danni",
            "pt_br": "Sim, sem dano",
            "ru": "Да, без урона",
            "zh_cn": "是，无伤害"
          },
          "set": {
            "config.yml:cold.enabled": true,
            "config.yml:cold.damage": false
          }
        },
        {
          "id": "harsh",
          "label": {
            "en": "Yes, freezing hurts",
            "de": "Ja, Erfrieren schadet",
            "fr": "Oui, le gel blesse",
            "it": "Sì, il congelamento ferisce",
            "pt_br": "Sim, congelar causa dano",
            "ru": "Да, мороз ранит",
            "zh_cn": "是，冻结会受伤"
          },
          "set": {
            "config.yml:cold.enabled": true,
            "config.yml:cold.damage": true
          }
        }
      ]
